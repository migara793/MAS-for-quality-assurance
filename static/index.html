<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>CI/CD QA Swarm Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-900 text-white font-sans">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const App = () => {
            const [logs, setLogs] = useState([]);
            const [agents, setAgents] = useState([]);
            const [reportContent, setReportContent] = useState("");
            const [showReport, setShowReport] = useState(false);
            const [status, setStatus] = useState("Idle");
            const [activeAgentName, setActiveAgentName] = useState(null);
            const scrollRef = useRef(null);

            const fetchReport = async () => {
                const res = await fetch("/report");
                const data = await res.json();
                if (data.content) setReportContent(data.content);
            };

            const fetchAgents = async () => {
                const res = await fetch("/agents");
                const data = await res.json();
                setAgents(data.agents);
            };

            useEffect(() => {
                fetchAgents();
                fetchReport();
                const es = new EventSource("/events");
                es.onmessage = (e) => {
                    const event = JSON.parse(e.data);
                    if (event.type === "agent") {
                        const match = event.message.match(/\[(.*?)\]/);
                        if (match) setActiveAgentName(match[1].trim());
                    }
                    if (event.message.includes("🏁 PIPELINE COMPLETED")) {
                        setStatus("Idle");
                        setActiveAgentName(null);
                        setTimeout(fetchReport, 2000);
                    }
                    if (event.message.includes("🚀 PIPELINE TRIGGERED:")) {
                        setStatus("Running");
                        setLogs([]);
                        setReportContent("");
                    }
                    setLogs(prev => [...prev, event]);
                };
                return () => es.close();
            }, []);

            useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight; }, [logs]);

            const run = async () => {
                setStatus("Running");
                await fetch("/run", {
                    method: "POST",
                    headers: {"Content-Type":"application/json"},
                    body: JSON.stringify({})
                });
            };

            return (
                <div className="flex h-screen overflow-hidden">
                    <div className="w-80 bg-gray-800 p-5 flex flex-col gap-5 overflow-y-auto">
                        <h1 className="text-xl font-bold">CI/CD SWARM</h1>
                        <div className="bg-blue-900/30 p-4 rounded border border-blue-500/50 text-sm text-blue-200">
                            <strong>Mode:</strong> Autonomous CI/CD<br/>
                            Triggered on push or manual override.
                        </div>
                        <button onClick={run} className={`py-4 rounded font-bold transition-all ${status === 'Running' ? 'bg-gray-700 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-500'}`} disabled={status === 'Running'}>
                            {status === 'Running' ? 'PIPELINE ACTIVE...' : 'TRIGGER CI/CD TEST'}
                        </button>
                        <div className="mt-5">
                            <h2 className="text-xs font-bold text-gray-500 mb-3 uppercase">Agents & Tools</h2>
                            {agents.map(a => (
                                <div key={a.name} className={`mb-3 p-3 rounded border ${activeAgentName === a.name ? 'border-blue-500 bg-blue-900/20' : 'border-gray-700 opacity-50'}`}>
                                    <div className="flex justify-between font-bold text-sm">
                                        <span>{a.name}</span>
                                    </div>
                                    <div className="text-[10px] text-gray-400 mt-1 uppercase">{a.role}</div>
                                    <div className="flex flex-wrap gap-1 mt-2">
                                        {a.tools.map(t => <span key={t} className="bg-gray-700 px-1 rounded text-[8px]">{t}</span>)}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                    <div className="flex-1 flex flex-col bg-black">
                        <div className="p-4 border-b border-gray-800 flex justify-between items-center">
                            <span className="text-xs font-bold text-gray-500 uppercase">CI/CD Telemetry</span>
                            {reportContent && (
                                <button onClick={() => setShowReport(true)} className="bg-green-600 px-4 py-1 rounded-full text-xs font-bold animate-pulse">
                                    VIEW CI/CD REPORT
                                </button>
                            )}
                        </div>
                        <div ref={scrollRef} className="flex-1 p-5 font-mono text-sm overflow-y-auto">
                            {logs.map((l, i) => (
                                <div key={i} className={`mb-2 ${l.type === 'agent' ? 'text-yellow-500' : l.type === 'tool' ? 'text-purple-400' : l.type === 'success' ? 'text-green-400' : 'text-blue-400'}`}>
                                    <span className="text-gray-600">[{l.time || "LOG"}]</span> {l.message}
                                </div>
                            ))}
                        </div>
                    </div>
                    {showReport && (
                        <div className="fixed inset-0 bg-black/95 flex items-center justify-center p-10 z-50">
                            <div className="bg-gray-900 border border-gray-700 rounded-xl w-full max-w-4xl h-full flex flex-col overflow-hidden">
                                <div className="p-5 border-b border-gray-800 flex justify-between items-center">
                                    <h2 className="text-xl font-bold uppercase tracking-widest">CI/CD TEST REPORT</h2>
                                    <button onClick={() => setShowReport(false)} className="text-gray-500 hover:text-white">CLOSE [X]</button>
                                </div>
                                <pre className="flex-1 p-10 overflow-auto whitespace-pre-wrap text-sm border-x border-gray-800 bg-black/20">{reportContent}</pre>
                                <div className="p-5 border-t border-gray-800 flex justify-end bg-gray-900">
                                    <button onClick={() => {
                                        const blob = new Blob([reportContent], { type: 'text/markdown' });
                                        const url = URL.createObjectURL(blob);
                                        const a = document.createElement('a'); a.href = url; a.download = 'CI_CD_REPORT.md'; a.click();
                                    }} className="bg-blue-600 px-10 py-3 rounded font-bold hover:bg-blue-500 transition-colors">DOWNLOAD (.md)</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };
        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
