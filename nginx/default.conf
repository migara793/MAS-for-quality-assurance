server {
    listen 80;
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
    location /run {
        proxy_pass http://qa-swarm:8000/run;
    }
    location /agents {
        proxy_pass http://qa-swarm:8000/agents;
    }
    location /tools {
        proxy_pass http://qa-swarm:8000/tools;
    }
    location /report {
        proxy_pass http://qa-swarm:8000/report;
    }
    location /events {
        proxy_pass http://qa-swarm:8000/events;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }
}
