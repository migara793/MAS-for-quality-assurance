services:
  qa-swarm:
    build: .
    ports:
      - "8000:8000"
      - "8003:8003"
    env_file:
      - .env
    volumes:
      - .:/app
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - QDRANT_HOST=qdrant
    depends_on:
      - qdrant
    networks:
      - mas-net

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - mas-net

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - qa-swarm
    networks:
      - mas-net

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --url http://qa-swarm:8000
    depends_on:
      - qa-swarm
    networks:
      - mas-net

networks:
  mas-net:
    driver: bridge

volumes:
  qdrant_storage:
